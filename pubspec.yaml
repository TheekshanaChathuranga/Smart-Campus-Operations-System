name: smart_campus_operations_system
description: "Smart Campus Operations System - A comprehensive university campus management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Networking
  dio: ^5.7.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Location & Maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Notifications
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
